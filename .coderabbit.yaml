# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Why: each batch of a release goes to the release branch in its own pull request, so
# that one review stays under the per-review file limit; CodeRabbit reviews only the
# default branch unless a base branch is listed here.
reviews:
  auto_review:
    # Why: reviews run locally with the CodeRabbit CLI when the owner asks, so a
    # round of fixes does not wait for a review of each push
    enabled: false
    base_branches:
      - "release-.*"
