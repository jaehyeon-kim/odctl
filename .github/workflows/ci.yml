name: CI

on:
  workflow_call:
  workflow_dispatch:


jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to a full version on purpose: setup-uv stopped publishing
        # moving major tags at v8, so astral-sh/setup-uv@v10 does not exist.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # The default key holds the runner's Python, not the matrix one, so
          # every job saved under one key and all but the first failed to save.
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Runs pre-commit directly instead of through pre-commit/action. That
      # action's last release, v3.0.1, ran this same command, but it also uses
      # actions/cache@v4, which runs on the deprecated Node.js 20.
      - name: Run pre-commit
        run: uvx pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Run Tests
        # Target your test folder and output coverage for src/odctl
        run: uv run --with pytest-cov pytest tests/ --cov=src/odctl --cov-report=xml

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     file: ./coverage.xml
