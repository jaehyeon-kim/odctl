name: CI

on:
  workflow_call:
  workflow_dispatch:


jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to a full version on purpose: setup-uv stopped publishing
        # moving major tags at v8, so astral-sh/setup-uv@v10 does not exist.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # The default key holds the runner's Python, not the matrix one, so
          # every job saved under one key and all but the first failed to save.
          cache-suffix: py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Runs pre-commit directly instead of through pre-commit/action. That
      # action's last release, v3.0.1, ran this same command, but it also uses
      # actions/cache@v4, which runs on the deprecated Node.js 20.
      - name: Run pre-commit
        run: uvx pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Run Tests
        # Target your test folder and output coverage for src/odctl
        run: uv run --extra mcp --with pytest-cov pytest tests/ --cov=src/odctl --cov-report=xml

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     file: ./coverage.xml

  plugin:
    # The manifests of the plugin for Claude Code, Codex and Antigravity.
    # tests/test_plugin.py checks the Codex files, which have no
    # validate command, and that every manifest carries pyproject.toml's version.
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      # agy warns when the MCP server's command, odctl, is not on PATH.
      - name: Install odctl
        run: |
          uv tool install .
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      # Pinned to the version the manifests were checked with.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.326

      # The documented installer takes no version, so this is the latest agy;
      # the log records which version validated the manifests.
      - name: Install agy
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agy" --version

      # --strict fails on a file Claude Code finds but does not load: CLAUDE.md,
      # which a plugin does not load as project context. Each tool validates a
      # copy of the tracked files, and Claude Code's copy has no CLAUDE.md.
      - name: Stage a copy for each tool
        run: |
          for tool in claude agy; do
            mkdir "$RUNNER_TEMP/$tool"
            git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/$tool"
          done
          rm "$RUNNER_TEMP/claude/CLAUDE.md"

      - name: Validate the Claude Code plugin and marketplace
        working-directory: ${{ runner.temp }}/claude
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .

      - name: Validate the Antigravity plugin
        working-directory: ${{ runner.temp }}/agy
        run: agy plugin validate --strict .

  lowest:
    # The suite at the lowest version of each dependency that pyproject.toml allows.
    # The locked versions pass while an older one that pip may install can break,
    # as Typer below 0.18.0 did with newer Click releases.
    name: Lowest dependency versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python 3.10
        run: uv python install 3.10

      # Without the mcp extra, the core dependencies sit at their floors and the
      # MCP tests are skipped. With it, mcp 2.3.0 raises pydantic to 2.12.0.
      - name: Run Tests without the mcp extra
        run: uv run --python 3.10 --isolated --resolution lowest-direct --with pytest pytest tests/

      - name: Run Tests with the mcp extra
        run: uv run --python 3.10 --isolated --resolution lowest-direct --extra mcp --with pytest pytest tests/
