name: End-to-End Integration Tests

on:
  workflow_call:
    inputs:
      profile_groups:
        description: >-
          JSON array of profile groups to run. The caller decides: every group
          on a tag, and only the groups a change affects on a pull request.
        required: true
        type: string
  # Rerun chosen groups by hand, for example after a registry timeout, without
  # rebuilding the images or rerunning the whole matrix. Pick the tag whose
  # images are published in "Use workflow from".
  workflow_dispatch:
    inputs:
      profile_groups:
        description: >-
          Profile groups to run, comma-separated, as the matrix names them. For
          example: feast, or feast,mlflow, or spark-lite spark-full.
        required: true
        default: feast
        type: string

jobs:
  # The matrix needs a JSON array. A caller passes one; a manual run passes
  # comma-separated text, which is converted here.
  groups:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.parse.outputs.json }}
    steps:
      - id: parse
        env:
          RAW: ${{ inputs.profile_groups }}
        run: |
          json=$(python3 -c '
          import json, os
          raw = os.environ["RAW"].strip()
          try:
              groups = json.loads(raw)
          except ValueError:
              groups = [g.strip() for g in raw.split(",") if g.strip()]
          if not isinstance(groups, list) or not groups:
              raise SystemExit("profile_groups is empty")
          print(json.dumps(groups))
          ')
          echo "Profile groups: $json"
          echo "json=$json" >> "$GITHUB_OUTPUT"

  e2e:
    needs: groups
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Groups come from select-profiles.py, which pairs the lite and full
        # variants that share a large image so the pull is paid for once.
        profile_group: ${{ fromJSON(needs.groups.outputs.json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to a full version on purpose: setup-uv stopped publishing
        # moving major tags at v8, so astral-sh/setup-uv@v10 does not exist.
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        run: uv python install 3.10

      - name: Install odctl
        run: uv tool install .

      - name: Initialize odctl workspace
        run: yes | odctl init --force

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Profile Group
        run: |
          chmod +x .github/scripts/smoke.sh
          for profile in ${{ matrix.profile_group }}; do
            echo "::group::Testing Profile: $profile"
            echo "🚀 Launching $profile..."
            odctl up "$profile"

            echo "⏳ Containers:"
            docker ps

            # Liveness alone has never been enough here: every bug fixed in 0.2.x
            # and 0.3.0 left healthy containers behind a broken profile, so the
            # smoke script asserts the profile can actually do its job.
            echo "🔍 Smoke testing $profile..."
            if ! .github/scripts/smoke.sh "$profile"; then
              echo "::error::Smoke test failed for $profile"
              docker ps -a
              odctl ps --all
              for c in $(docker ps -aq); do
                echo "---- logs: $(docker inspect --format '{{.Name}}' "$c") ----"
                docker logs --tail 40 "$c" 2>&1 || true
              done
              exit 1
            fi

            # Tear down by name before sweeping with --all. These are two code
            # paths: --all resolves dependency profiles for itself, while a
            # named teardown did not until 0.4.3, so compose rejected the
            # project with "depends on undefined service" and only the named
            # form could catch it. Naming the profile is also what a user runs.
            echo "🧹 Tearing down $profile by name..."
            yes | odctl down "$profile" --volumes

            # Sweep afterwards so a failure above cannot leak state into the
            # next profile in the group. This is a no-op when the named
            # teardown succeeded.
            yes | odctl down --all --volumes
            echo "::endgroup::"
          done
