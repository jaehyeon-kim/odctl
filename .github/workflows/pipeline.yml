name: Main Pipeline

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push to a pull request supersedes the run already going for it, so the older
# run is cancelled rather than finishing work nobody reads. Pushes to main and tags
# always complete, because cancel-in-progress is limited to pull requests, so a docs
# deploy or an image build is never stopped halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # Which parts of the tree moved. Used to skip the multi-arch image builds on
  # changes that cannot affect them, which is most changes.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.filter.outputs.images }}
      profile_groups: ${{ steps.profiles.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            images:
              - 'src/odctl/resources/deps/**'
              - 'src/odctl/resources/docker/**'
              - '.github/workflows/build-deps.yml'
              - '.github/workflows/build-platform-images.yml'

      # A tag runs every profile. A pull request runs only the groups its
      # changed files affect, because the full matrix pulls roughly 10 GB per
      # entry and paying that on every push is not worth the signal.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Choose profile groups
        id: profiles
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only \
              "origin/${{ github.base_ref }}"...HEAD)
            echo "Changed files:"; echo "$changed"
            groups=$(uv run --with pyyaml python .github/scripts/select-profiles.py $changed)
          else
            groups=$(uv run --with pyyaml python .github/scripts/select-profiles.py --all)
          fi
          echo "Profile groups: $groups"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  # Images are pushed only on a tag, so on any other ref this is a
  # build-and-discard. Run it when the build inputs changed, so a broken
  # Dockerfile surfaces before release instead of at tag time, and skip it
  # otherwise. That removes two multi-arch builds from the typical change.
  build-platform:
    needs: [ci, changes]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.images == 'true'
    uses: ./.github/workflows/build-platform-images.yml

  build-deps:
    needs: [ci, changes]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.images == 'true'
    uses: ./.github/workflows/build-deps.yml

  # Tags and manual runs only. TAG follows the CLI version and the images for an
  # unreleased version do not exist yet, so a pull request cannot pull them and
  # the preflight refuses every profile. The matrix is still selected from the
  # changed files, which keeps a manual dispatch proportionate.
  e2e:
    needs: [changes, build-platform, build-deps]
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.profile_groups != '[]' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/e2e-test.yml
    with:
      profile_groups: ${{ needs.changes.outputs.profile_groups }}

  # A strict build fails on a broken link or anchor, so a pull request finds it
  # before the docs job deploys from main. Material prints a notice about MkDocs 2.0
  # that strict mode counts as a warning; the variable turns that notice off.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: docs
      - name: Build the docs in strict mode
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: uv run mkdocs build --strict

  # The site is published from main, as dynamic-des does, after the unit tests,
  # lint and the strict build pass. Each version in pyproject.toml gets its own
  # copy, because each CLI version runs images with its own tag.
  docs:
    needs: [ci, docs-build]
    permissions:
      contents: write
      pages: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # mike needs the full history to update the gh-pages branch
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Deploy the versioned docs
        run: |
          # Commit as the owner, so the gh-pages history adds no bot contributor.
          git config --global user.name "jaehyeon-kim"
          git config --global user.email "1023748+jaehyeon-kim@users.noreply.github.com"

          # Version 1.0.0 in pyproject.toml is published as 1.0.0, aliased latest.
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "Deploying docs version $VERSION"
          uv run mike deploy --push --update-aliases "$VERSION" latest

          # The root of the site opens latest.
          uv run mike set-default --push latest

          # GitHub Pages answers every missing path under the site with the 404.html
          # at the root of gh-pages, but mike writes one into each version folder
          # only. Copy this version's page to the root. Its links point at latest/,
          # so it renders at any depth.
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
          cp "$RUNNER_TEMP/gh-pages/$VERSION/404.html" "$RUNNER_TEMP/gh-pages/404.html"
          git -C "$RUNNER_TEMP/gh-pages" add 404.html
          git -C "$RUNNER_TEMP/gh-pages" diff --cached --quiet || git -C "$RUNNER_TEMP/gh-pages" commit -m "Root 404 page from $VERSION"
          git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages
