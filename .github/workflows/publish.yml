name: Publish to PyPI

# Publishing stays tied to publishing a release, so the release notes remain the
# trigger. Two gates run before the package is built. A release event fires
# independently of CI, which is how v0.3.0 reached PyPI while the pipeline's e2e
# job was failing, so the first gate waits for the tag's Main Pipeline run and
# refuses to publish unless it succeeded. The second gate asks ghcr whether the
# images for this version are actually there, because the CLI resolves every
# image it builds at its own version and a package published ahead of its images
# installs and then fails on the first `odctl up`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.3.1"
        required: true
      skip_pipeline_check:
        description: "Publish even if the tag's pipeline is not green"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    # These permissions are strictly required for PyPI OIDC Trusted Publishing;
    # actions:read is what lets the gate query the pipeline's conclusion, and
    # packages:read is what lets the image gate read ghcr.
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Require a green Main Pipeline for this tag
        if: ${{ !inputs.skip_pipeline_check }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # Wait rather than fail outright: a release is usually published moments
          # after the tag is pushed, so the pipeline is still running e2e.
          deadline=$(( SECONDS + 45 * 60 ))
          while :; do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&per_page=100" \
                    --jq "[.workflow_runs[]
                           | select(.name == \"Main Pipeline\" and .head_branch == \"${TAG}\")]
                           | sort_by(.created_at) | last // empty")
            if [ -z "$run" ]; then
              echo "::error::No Main Pipeline run found for tag ${TAG}. Push the tag first."
              exit 1
            fi
            status=$(jq -r '.status'     <<<"$run")
            concl=$(jq  -r '.conclusion' <<<"$run")
            url=$(jq    -r '.html_url'   <<<"$run")
            if [ "$status" = "completed" ]; then
              if [ "$concl" = "success" ]; then
                echo "✅ Main Pipeline for ${TAG} succeeded: $url"
                exit 0
              fi
              echo "::error::Main Pipeline for ${TAG} concluded '${concl}', refusing to publish: $url"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Main Pipeline for ${TAG} still '${status}' after 45 minutes: $url"
              exit 1
            fi
            echo "⏳ Main Pipeline for ${TAG} is ${status}; waiting: $url"
            sleep 30
          done

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A green pipeline proves a workflow run succeeded. It does not prove the
      # images reached ghcr, and that is the fact the published package depends
      # on. This step checks the registry directly. It has no override input on
      # purpose: publishing a version with no images behind it is the failure the
      # gate exists to prevent.
      - name: Require published images for this tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          # docker/metadata-action tags with the bare semver, so the leading v
          # is not part of the image tag.
          version="${TAG#v}"
          # `|| true` keeps a no-match grep from ending the step under set -e,
          # so the empty case reports something a reader can act on.
          repositories=$(grep -rhoE "ghcr\.io/${GITHUB_REPOSITORY}/[a-z0-9._-]+" \
                          src/odctl/resources/ | sort -u || true)
          if [ -z "$repositories" ]; then
            echo "::error::Found no ghcr images in the compose files. Has the path moved?"
            exit 1
          fi
          missing=0
          for repository in $repositories; do
            reference="${repository}:${version}"
            if docker manifest inspect "$reference" >/dev/null 2>&1; then
              echo "✅ $reference is published"
            else
              echo "::error::No image published at ${reference}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install uv
        # Pinned to a full version on purpose: setup-uv stopped publishing
        # moving major tags at v8, so astral-sh/setup-uv@v10 does not exist.
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        run: uv python install 3.10

      - name: Build Wheel and sdist
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
