repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml names the emoji functions with !!python/name, which a safe
        # load rejects. --unsafe checks syntax only, without constructing the tags.
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=800"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      # Guide snippets are steps of a page, not modules, and keep the layout the
      # page shows: a later step uses names an earlier one defines, and the
      # docs test checks each page against its file.
      - id: ruff-check
        args: [--fix]
        exclude: ^docs/snippets/
      - id: ruff-format
        exclude: ^docs/snippets/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - types-PyYAML
        args: [--ignore-missing-imports]
        exclude: ^docs/snippets/
