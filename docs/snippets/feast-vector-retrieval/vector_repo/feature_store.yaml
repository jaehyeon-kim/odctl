project: vector_demo
provider: local
registry:
  registry_type: sql
  path: postgresql+psycopg://user:password@127.0.0.1:5432/feast
offline_store:
  type: duckdb
online_store:
  type: postgres
  host: 127.0.0.1
  port: 5432
  database: vector
  user: user
  password: password
  sslmode: disable
  vector_enabled: true
entity_key_serialization_version: 3
