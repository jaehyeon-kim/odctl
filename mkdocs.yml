site_name: Open Data Stack (odctl)
site_description: Run an open data stack on your machine, with its services already connected, from one command.
# mike appends a folder to site_url when it deploys a version. canonical_version
# below makes that folder latest/, so every version's pages name the same page
# under latest/ as canonical and search engines index one copy, not one per release.
site_url: https://jaehyeon.me/odctl/
repo_url: https://github.com/jaehyeon-kim/odctl
repo_name: odctl

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/favicon.png
  palette:
    - scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Each code block gets a copy button and a button to select lines by their
    # numbers; docs/javascripts/code-lines.js adds a third that hides the line numbers.
    - content.code.copy
    - content.code.select
    # Previous and next links at the foot of each page, so a reader can follow
    # the pages in nav order: each guide builds on the pages before it.
    - navigation.footer

plugins:
  - search
  - mike:
      canonical_version: latest
  # Writes the profile pages, the CLI reference and the diagram at build time.
  - gen-files:
      scripts:
        - scripts/gen_pages.py
  # Reads profiles/SUMMARY.md, which gen_pages.py writes, for the Profiles section.
  - literate-nav
  # llms.txt and llms-full.txt for AI assistants (#132): an index of the pages with
  # their links, and the pages themselves as Markdown. scripts/llmstxt_sections.py
  # builds the sections from the nav. mike serves each version under its own folder,
  # so the links point at latest/, where the current pages are.
  - llmstxt:
      base_url: https://jaehyeon.me/odctl/latest/
      full_output: llms-full.txt
      sections: {} # required by the plugin; filled from the nav by the hook

# local_links.py makes local service addresses clickable, with rel="nofollow".
# release_links.py points links to files on main at the release tag.
hooks:
  - scripts/local_links.py
  - scripts/llmstxt_sections.py
  - scripts/release_links.py

# Labs is hidden until its first lab is published; remove these lines to show it.
exclude_docs: |
  labs.md
  assets/diagrams/labs.*

# A link to a heading that does not exist is a warning, which --strict fails.
validation:
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

extra_css:
  - stylesheets/extra.css
  - stylesheets/neoteroi-mkdocs.css
  - stylesheets/roadmap.css
  - stylesheets/tables.css
  - stylesheets/code-lines.css

extra_javascript:
  - javascripts/code-lines.js

extra:
  version:
    provider: mike
  # Same property as the blog and desflow, so all sit in one view. Filter by /odctl/.
  analytics:
    provider: google
    property: G-076N8WCGWZ

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - How It Works: how-it-works.md
  - Profiles: profiles/
  - Guides:
      - Streaming:
          - Kafka: guides/kafka.md
          - Kafka Connect: guides/kafka-connect.md
          - Flink SQL: guides/flink-sql.md
          - Rolling Windows: guides/rolling-windows.md
          - Fluss: guides/fluss.md
      - Lakehouse and Batch:
          - Ingest into Iceberg: guides/iceberg-ingestion.md
          - Spark: guides/spark.md
      - Analytics:
          - ClickHouse: guides/clickhouse.md
          - Trino and Metabase: guides/trino-metabase.md
      - Orchestration:
          - Airflow DAGs from S3: guides/airflow-dags.md
          - Temporal Workers: guides/temporal-workers.md
      - ML and AI:
          - Feast with Iceberg: guides/feast-iceberg.md
          - MLflow: guides/mlflow.md
          - Evidently Reports: guides/evidently-reports.md
          - Hybrid Search: guides/hybrid-search.md
          - Valkey: guides/valkey.md
      - Metadata and Operations:
          - OpenLineage and Marquez: guides/lineage.md
          - OpenMetadata: guides/openmetadata.md
          - Telemetry: guides/telemetry.md
  - CLI Reference: cli.md
  - Troubleshooting: troubleshooting.md
  - About:
      - Why odctl: about/why-odctl.md
      - Roadmap: about/roadmap.md
      - Changelog: about/changelog.md

markdown_extensions:
  - attr_list
  - md_in_html
  - neoteroi.timeline
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
