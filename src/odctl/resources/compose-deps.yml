name: odctl-deps

services:
  # ==========================================
  # Init Container: Populates the Shared Volume
  # ==========================================
  init-deps:
    image: ghcr.io/jaehyeon-kim/odctl/deps:${TAG:-latest}
    container_name: odctl-init-deps
    networks:
      - odctl
    profiles:
      - deps
    volumes:
      # Mounts the named volume to the export path defined in the Dockerfile
      - odctl-shared-deps:/mnt/shared-deps/
    # Replaces the image's `cp -r`, which rewrote every jar on each `odctl up`, so a
    # running Spark or Flink could read a half-written jar. Only a missing or
    # changed file is copied, to a temporary name and then renamed into place, so
    # a reader sees either the old file or the new one.
    #
    # Files the image no longer contains are then removed. Without that, an
    # upgrade left the previous version's jars beside the new ones, and Kafka
    # Connect loaded Debezium 3.5.1 instead of 3.7.0 (#126). A service that
    # already opened an old jar keeps reading it until it restarts.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        cd /workspace
        find . -type f | while read -r file; do
          dest="/mnt/shared-deps/$${file#./}"
          cmp -s "$$file" "$$dest" 2>/dev/null && continue
          mkdir -p "$$(dirname "$$dest")"
          cp "$$file" "$$dest.partial"
          mv -f "$$dest.partial" "$$dest"
        done
        cd /mnt/shared-deps
        find . -type f | while read -r file; do
          [ -e "/workspace/$${file#./}" ] && continue
          rm -f "$$file"
          echo "Removed $${file#./}, which this version no longer ships"
        done
        find . -mindepth 1 -type d -empty -delete
        echo '✅ Open Data Stack Dependencies populated.'

networks:
  odctl:
    name: odctl

volumes:
  odctl-shared-deps:
    name: odctl-shared-deps
