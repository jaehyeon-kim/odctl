name: odctl-infra

services:
  # ==========================================
  # Unified Metadata & Vector DB (Postgres 18)
  # ==========================================
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: postgres
    ports:
      - "5432:5432"
    networks:
      - odctl
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odctl}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      TZ: ${TZ:-UTC}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "track_activity_query_size=2048"
      - "-c"
      - "work_mem=10MB"
    volumes:
      - ./postgres/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ==========================================
  # Object Storage (SeaweedFS - Single Node)
  # ==========================================
  seaweed:
    image: &seaweed-image chrislusf/seaweedfs:4.22
    container_name: seaweed
    ports:
      - "8333:8333" # S3 API
      - "8889:8888" # Filer UI
      - "9333:9333" # Master UI
    networks:
      odctl:
        aliases:
          - warehouse.seaweed
    profiles:
      - storage
    volumes:
      # Mount the S3 credentials configuration
      - ./seaweed/s3.json:/etc/seaweedfs/s3.json:ro
    # Explicitly tell the S3 gateway to enforce the config file
    command: "server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.domainName=warehouse.seaweed -ip.bind=0.0.0.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweed-init:
    image: *seaweed-image
    container_name: seaweed-init
    depends_on:
      seaweed:
        condition: service_healthy
    networks:
      - odctl
    profiles:
      - storage
    entrypoint: |
      sh -c "
      echo '...waiting for SeaweedFS Master...'
      sleep 2

      BUCKETS='warehouse odctl-dev flink-checkpoints flink-savepoints airflow mlflow'
      for bucket in \$$BUCKETS; do
        echo \"--- Creating S3 bucket natively: \$$bucket ---\"
        echo \"s3.bucket.create -name \$$bucket\" | weed shell -master=seaweed:9333
      done

      echo '--- SeaweedFS Native Setup Complete ---'
      exit 0
      "

  # ==========================================
  # Iceberg REST Catalog
  # ==========================================
  catalog:
    # apache/iceberg-rest-fixture is the maintained successor to
    # tabulario/iceberg-rest, which stopped at Iceberg 1.6 and rejects table
    # format version 3. Same RESTCatalogServer codebase and the same CATALOG_*
    # environment convention, but unlike tabulario it ships no JDBC driver, and
    # its default `java -jar` command cannot pick one up. Hence the classpath
    # form below, with the Postgres driver taken from the shared deps volume.
    image: apache/iceberg-rest-fixture:1.10.1
    command:
      - java
      - -cp
      - /usr/lib/iceberg-rest/iceberg-rest-adapter.jar:/mnt/shared-deps/shared/postgresql.jar
      - org.apache.iceberg.rest.RESTCatalogServer
    container_name: iceberg-catalog
    ports:
      - "8181:8181"
    networks:
      - odctl
    volumes:
      # Supplies the Postgres JDBC driver named on the classpath above
      - odctl-shared-deps:/mnt/shared-deps:ro
    profiles:
      - catalog
    depends_on:
      postgres:
        condition: service_healthy
      seaweed-init:
        condition: service_completed_successfully
    mem_limit: 512m
    environment:
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://seaweed:8333
      # The image maps a double underscore to a hyphen and a single one to a dot,
      # so hyphenated Iceberg properties need __ or they resolve to names Iceberg
      # ignores. With path-style access silently dropped, S3FileIO addressed
      # buckets virtual-host style and SeaweedFS read the namespace as the bucket.
      - CATALOG_S3_ACCESS__KEY__ID=user
      - CATALOG_S3_SECRET__ACCESS__KEY=password
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      # Explicit AWS SDK overrides (just in case)
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-user}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-password}
      # Database Backend (Postgres)
      - CATALOG_CATALOG__IMPL=org.apache.iceberg.jdbc.JdbcCatalog
      - CATALOG_URI=jdbc:postgresql://postgres:5432/iceberg
      - CATALOG_JDBC_USER=${POSTGRES_USER:-user}
      - CATALOG_JDBC_PASSWORD=${POSTGRES_PASSWORD:-password}

networks:
  odctl:
    name: odctl
    external: true

volumes:
  odctl-shared-deps:
    name: odctl-shared-deps
    external: true
