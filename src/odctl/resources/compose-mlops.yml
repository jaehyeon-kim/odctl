name: odctl-mlops

# Shared environment variables for SeaweedFS (S3) authentication
x-mlops-env: &mlops-env
  TZ: ${TZ:-UTC}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # Internal Docker routing to your SeaweedFS API
  AWS_ENDPOINT_URL: http://seaweed:8333
  # Allows on-the-fly pip installations without needing a requirements.txt file.
  # A served model's own library has to be importable here to unpickle, so this
  # is how a flavour the image does not carry gets added without a rebuild.
  _PIP_ADDITIONAL_REQUIREMENTS: ${_MLOPS_PIP_DEPS:-}

# Feast reads S3 settings only from the environment; ODCTL must match the
# catalog_name passed to IcebergSource.
x-feast-env: &feast-env
  TZ: ${TZ:-UTC}
  PYICEBERG_CATALOG__ODCTL__TYPE: rest
  PYICEBERG_CATALOG__ODCTL__URI: http://catalog:8181
  PYICEBERG_CATALOG__ODCTL__WAREHOUSE: s3://warehouse/
  PYICEBERG_CATALOG__ODCTL__S3__ENDPOINT: http://seaweed:8333
  PYICEBERG_CATALOG__ODCTL__S3__ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
  PYICEBERG_CATALOG__ODCTL__S3__SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
  PYICEBERG_CATALOG__ODCTL__S3__PATH_STYLE_ACCESS: "true"
  PYICEBERG_CATALOG__ODCTL__S3__REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # For copying the feature repository from s3://feast/repo at start.
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

# The Feast services' start-up: the feature repository comes from s3://feast/repo,
# as DAGs come from s3://airflow/dags, or from the bundled repository when that
# prefix is empty. The prefix is listed every 15 seconds, and a change reloads the
# repository and restarts Feast. The arguments after the script go to `feast`.
x-feast-repo-sync: &feast-repo-sync |
  import os, shutil, signal, subprocess, sys, time
  import boto3
  REPO = "/tmp/feature_repo"
  s3 = boto3.client("s3", endpoint_url="http://seaweed:8333")
  def listing():
      pages = s3.get_paginator("list_objects_v2").paginate(Bucket="feast", Prefix="repo/")
      return sorted((o["Key"], o["ETag"]) for p in pages for o in p.get("Contents", []) if not o["Key"].endswith("/"))
  def load(objects):
      shutil.rmtree(REPO, ignore_errors=True)
      if not objects:
          shutil.copytree("/bundled_repo", REPO)
      for key, _ in objects:
          path = os.path.join(REPO, key.removeprefix("repo/"))
          os.makedirs(os.path.dirname(path), exist_ok=True)
          s3.download_file("feast", key, path)
      print("Feature repository:", "s3://feast/repo" if objects else "bundled", flush=True)
  def start():
      return subprocess.Popen(["feast", "-c", REPO, *sys.argv[1:]])
  signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
  objects = listing()
  load(objects)
  feast = start()
  try:
      while feast.poll() is None:
          time.sleep(15)
          try:
              latest = listing()
          except Exception as error:
              print("Listing s3://feast/repo failed:", error, flush=True)
              continue
          if latest != objects:
              objects = latest
              feast.terminate()
              feast.wait()
              load(objects)
              feast = start()
      sys.exit(feast.returncode)
  finally:
      if feast.poll() is None:
          feast.terminate()
          feast.wait()

services:
  # ==========================================
  # MLflow: Experiment Tracking & Model Registry
  # ==========================================
  mlflow:
    image: ghcr.io/jaehyeon-kim/odctl/mlops:${TAG:-latest}
    container_name: mlflow
    profiles: ["mlflow"]
    networks:
      - odctl
    ports:
      # Host 5004: macOS binds 5000 to the AirPlay receiver.
      - "5004:5000"
    mem_limit: 2500m
    environment:
      <<: *mlops-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Each worker imports the ML runtimes in the mlops image, so memory is about
    # 1.1G fixed plus 0.35G per worker: 1.46G at one, 1.81G at two and 2.58G at
    # the default four. Two is enough for a local stack. A comment cannot live
    # inside the folded block below, where it becomes an argument.
    # allowed-hosts needs both the container port and the published one: 5000
    # for anything inside, 5004 from the host. A missing entry gives 403 while
    # /health still answers 200, so the container looks healthy.
    # --expose-prometheus serves request metrics at /metrics, keeping per-worker
    # files in the given directory so both workers are counted.
    # Never comment inside the command block: YAML folds it into the arguments.
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000,localhost:5004,127.0.0.1:5004
      --workers 2
      --expose-prometheus /tmp/mlflow-prometheus

  # ==========================================
  # MLflow Model Server: scores one registered model
  # ==========================================
  # Part of the mlflow profile. With MODEL_URI empty it waits and reports healthy;
  # set MODEL_URI in .env and run `odctl up mlflow` again to serve that model.
  # One model per container, because --model-uri is singular. To serve a second
  # model, copy this block, rename it, and give it another host port.
  mlflow-serve:
    image: ghcr.io/jaehyeon-kim/odctl/mlops:${TAG:-latest}
    container_name: mlflow-serve
    profiles: ["mlflow"]
    networks:
      - odctl
    ports:
      - "5003:5003"
    mem_limit: 1500m
    environment:
      <<: *mlops-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Accepts models:/name@alias, runs:/<run-id>/<path>, or an s3:// path.
      MODEL_URI: ${MODEL_URI:-}
    command:
      - bash
      - -c
      - |
        if [ -z "$${MODEL_URI}" ]; then
          echo "MODEL_URI is empty: nothing to serve. Set it in .env and run odctl up mlflow."
          exec sleep infinity
        fi
        exec mlflow models serve --model-uri "$${MODEL_URI}" --env-manager local --host 0.0.0.0 --port 5003
    # Loading the model can fail long after the process starts, for example when
    # MODEL_URI names nothing. Without this check `odctl up mlflow` reports
    # success on a container that has already exited. Waiting idle is healthy.
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$${MODEL_URI}\" ] || curl -f http://localhost:5003/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mlflow:
        condition: service_healthy

  # ==========================================
  # Feast: Feature Store
  # ==========================================
  # Stores no feature values: offline in Iceberg, online in valkey, only
  # definitions in the SQL registry.
  #
  # Upload your own feature repository to s3://feast/repo, as DAGs go to
  # s3://airflow/dags, and run `feast apply` yourself. Your environment needs
  # feast[duckdb,iceberg,redis,postgres]; the image needs no extras because
  # neither service reads Iceberg.
  #
  # The image sets no CMD, so both services name their own command.
  feast-ui:
    image: &feast-image quay.io/feastdev/feature-server:0.66.0
    container_name: feast-ui
    profiles: ["feast"]
    networks:
      - odctl
    ports:
      - "8890:8888"
    mem_limit: 1g
    environment:
      <<: *feast-env
    volumes:
      - ./feast:/bundled_repo:ro
    command: ["python", "-c", *feast-repo-sync, "ui", "--host", "0.0.0.0", "--port", "8888"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/api/v1/projects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  feast-serve:
    image: *feast-image
    container_name: feast-serve
    profiles: ["feast"]
    networks:
      - odctl
    ports:
      - "6566:6566"
    mem_limit: 1g
    environment:
      <<: *feast-env
    volumes:
      - ./feast:/bundled_repo:ro
    # --metrics starts Feast's Prometheus endpoint on port 8000, inside the network.
    command: ["python", "-c", *feast-repo-sync, "serve", "--host", "0.0.0.0", "--port", "6566", "--no-access-log", "--metrics"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6566/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  odctl:
    name: odctl
    external: true
