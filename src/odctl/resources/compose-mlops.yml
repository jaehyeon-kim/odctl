name: odctl-mlops

# Shared environment variables for SeaweedFS (S3) authentication
x-mlops-env: &mlops-env
  TZ: ${TZ:-UTC}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # Internal Docker routing to your SeaweedFS API
  AWS_ENDPOINT_URL: http://seaweed:8333
  # Allows on-the-fly pip installations without needing a requirements.txt file.
  # A served model's own library has to be importable here to unpickle, so this
  # is how a flavour the image does not carry gets added without a rebuild.
  _PIP_ADDITIONAL_REQUIREMENTS: ${_MLOPS_PIP_DEPS:-}

services:
  # ==========================================
  # MLflow: Experiment Tracking & Model Registry
  # ==========================================
  mlflow:
    image: ghcr.io/jaehyeon-kim/odctl/mlops:${TAG:-latest}
    container_name: mlflow
    profiles: ["mlflow"]
    networks:
      - odctl
    ports:
      - "5000:5000"
    environment:
      <<: *mlops-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres/mlflow
      --artifacts-destination s3://mlflow
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000

  # ==========================================
  # MLflow Model Server: scores one registered model
  # ==========================================
  # One model per container, because --model-uri is singular. To serve a second
  # model, copy this block, rename it, and give it another host port.
  mlflow-serve:
    image: ghcr.io/jaehyeon-kim/odctl/mlops:${TAG:-latest}
    container_name: mlflow-serve
    profiles: ["mlflow-serve"]
    networks:
      - odctl
    ports:
      - "5003:5003"
    environment:
      <<: *mlops-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
    # MODEL_URI has no default on purpose, so an unset value stops the container
    # rather than serving something unintended. It is not written as
    # ${MODEL_URI:?...}, because compose interpolates the whole file and that
    # form would break `odctl up mlflow` as well. Accepts models:/name@alias,
    # runs:/<run-id>/<path>, or an s3:// path.
    command: >
      mlflow models serve
      --model-uri ${MODEL_URI}
      --env-manager local
      --host 0.0.0.0
      --port 5003
    # Loading the model can fail long after the process starts, for example when
    # MODEL_URI names nothing. Without this check `odctl up mlflow-serve`
    # reports success on a container that has already exited.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mlflow:
        condition: service_healthy

networks:
  odctl:
    name: odctl
    external: true
