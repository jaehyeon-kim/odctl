name: odctl-mlops

# Shared environment variables for SeaweedFS (S3) authentication
x-mlops-env: &mlops-env
  TZ: ${TZ:-UTC}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # Internal Docker routing to your SeaweedFS API
  AWS_ENDPOINT_URL: http://seaweed:8333
  # Allows on-the-fly pip installations without needing a requirements.txt file.
  # A served model's own library has to be importable here to unpickle, so this
  # is how a flavour the image does not carry gets added without a rebuild.
  _PIP_ADDITIONAL_REQUIREMENTS: ${_MLOPS_PIP_DEPS:-}

# Feast reads S3 settings only from the environment; ODCTL must match the
# catalog_name passed to IcebergSource.
x-feast-env: &feast-env
  TZ: ${TZ:-UTC}
  PYICEBERG_CATALOG__ODCTL__TYPE: rest
  PYICEBERG_CATALOG__ODCTL__URI: http://catalog:8181
  PYICEBERG_CATALOG__ODCTL__WAREHOUSE: s3://warehouse/
  PYICEBERG_CATALOG__ODCTL__S3__ENDPOINT: http://seaweed:8333
  PYICEBERG_CATALOG__ODCTL__S3__ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
  PYICEBERG_CATALOG__ODCTL__S3__SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
  PYICEBERG_CATALOG__ODCTL__S3__PATH_STYLE_ACCESS: "true"
  PYICEBERG_CATALOG__ODCTL__S3__REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # For copying the feature repository from s3://feast/repo at start.
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

# The Feast services' start-up: the feature repository comes from s3://feast/repo,
# as DAGs come from s3://airflow/dags, or from the bundled repository when that
# prefix is empty. The prefix is listed every 15 seconds, and a change reloads the
# repository and restarts Feast. The arguments after the script go to `feast`.
x-feast-repo-sync: &feast-repo-sync |
  import os, shutil, signal, subprocess, sys, time
  import boto3
  REPO = "/tmp/feature_repo"
  s3 = boto3.client("s3", endpoint_url="http://seaweed:8333")
  def listing():
      pages = s3.get_paginator("list_objects_v2").paginate(Bucket="feast", Prefix="repo/")
      return sorted((o["Key"], o["ETag"]) for p in pages for o in p.get("Contents", []) if not o["Key"].endswith("/"))
  def load(objects):
      shutil.rmtree(REPO, ignore_errors=True)
      if not objects:
          shutil.copytree("/bundled_repo", REPO)
      for key, _ in objects:
          path = os.path.join(REPO, key.removeprefix("repo/"))
          os.makedirs(os.path.dirname(path), exist_ok=True)
          s3.download_file("feast", key, path)
      print("Feature repository:", "s3://feast/repo" if objects else "bundled", flush=True)
  def reload():
      # An object can vanish between the listing and its download when the
      # prefix changes during a load, so list again and retry until a load ends.
      while True:
          try:
              objects = listing()
              load(objects)
              return objects
          except Exception as error:
              print("Loading s3://feast/repo failed, trying again:", error, flush=True)
              time.sleep(5)
  def start():
      return subprocess.Popen(["feast", "-c", REPO, *sys.argv[1:]])
  signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
  objects = reload()
  feast = start()
  try:
      while feast.poll() is None:
          time.sleep(15)
          try:
              latest = listing()
          except Exception as error:
              print("Listing s3://feast/repo failed:", error, flush=True)
              continue
          if latest != objects:
              feast.terminate()
              feast.wait()
              objects = reload()
              feast = start()
      sys.exit(feast.returncode)
  finally:
      if feast.poll() is None:
          feast.terminate()
          feast.wait()

services:
  # ==========================================
  # MLflow: Experiment Tracking & Model Registry
  # ==========================================
  mlflow:
    image: ghcr.io/jaehyeon-kim/odctl/mlflow:${TAG:-latest}
    container_name: mlflow
    profiles: ["mlflow"]
    networks:
      - odctl
    ports:
      # Host 5004: macOS binds 5000 to the AirPlay receiver.
      - "127.0.0.1:5004:5000"
    mem_limit: 2500m
    environment:
      <<: *mlops-env
      # The command reads it as "$$MLFLOW_DB_URL", so a password with a shell
      # character such as $ or a quote reaches MLflow unchanged.
      MLFLOW_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres/mlflow
      # The server's job workers run automatic evaluation, and a judge with a
      # gateway:/ model calls the gateway at this address. Unset, the server
      # gives them http://0.0.0.0:5000 from --host, which --allowed-hosts
      # refuses with "Invalid Host header".
      MLFLOW_GATEWAY_URI: http://127.0.0.1:5000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Each worker imports the ML runtimes in the mlflow image, so memory is about
    # 1.1G fixed plus 0.35G per worker: 1.46G at one, 1.81G at two and 2.58G at
    # the default four. Two is enough for a local stack. A comment cannot live
    # inside the folded block below: it joins the shell line, and sh ignores
    # everything after the #.
    # allowed-hosts needs both the container port and the published one: 5000
    # for anything inside, 5004 from the host. A missing entry gives 403 while
    # /health still answers 200, so the container looks healthy.
    # --expose-prometheus serves request metrics at /metrics, keeping per-worker
    # files in the given directory so both workers are counted.
    # mlflow db upgrade runs first on every start, before the workers: a server
    # refuses a database from an older MLflow with "Detected out-of-date database
    # schema", and PostgreSQL keeps the mlflow database across odctl recreate. It
    # creates the tables on an empty database, upgrades an older one and changes
    # nothing on a current one. It runs its migrations in one transaction, so a
    # stopped upgrade leaves the old schema, and the next start runs it again.
    # Compose runs a command string with no shell, so && needs sh -c, and exec
    # lets the server receive docker stop's signal.
    command:
      - sh
      - -c
      - >
        mlflow db upgrade "$$MLFLOW_DB_URL"
        && exec mlflow server
        --backend-store-uri "$$MLFLOW_DB_URL"
        --artifacts-destination s3://mlflow
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
        --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000,localhost:5004,127.0.0.1:5004
        --workers 2
        --expose-prometheus /tmp/mlflow-prometheus

  # ==========================================
  # MLflow Model Server: scores one registered model
  # ==========================================
  # Part of the mlflow profile. With MODEL_URI empty it waits and reports healthy;
  # set MODEL_URI in .env and run `odctl recreate mlflow` to serve that model.
  # One model per container, because --model-uri is singular. To serve a second
  # model, copy this block, rename it, and give it another host port.
  mlflow-serve:
    image: ghcr.io/jaehyeon-kim/odctl/mlflow:${TAG:-latest}
    container_name: mlflow-serve
    profiles: ["mlflow"]
    networks:
      - odctl
    ports:
      - "127.0.0.1:5003:5003"
    mem_limit: 1500m
    environment:
      <<: *mlops-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Accepts models:/name@alias, runs:/<run-id>/<path>, or an s3:// path.
      MODEL_URI: ${MODEL_URI:-}
    command:
      - bash
      - -c
      - |
        if [ -z "$${MODEL_URI}" ]; then
          echo "MODEL_URI is empty: nothing to serve. Set it in .env and run odctl up mlflow."
          exec sleep infinity
        fi
        exec mlflow models serve --model-uri "$${MODEL_URI}" --env-manager local --host 0.0.0.0 --port 5003
    # Loading the model can fail long after the process starts, for example when
    # MODEL_URI names nothing. Without this check `odctl up mlflow` reports
    # success on a container that has already exited. Waiting idle is healthy.
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$${MODEL_URI}\" ] || curl -f http://localhost:5003/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mlflow:
        condition: service_healthy

  # ==========================================
  # Feast: Feature Store
  # ==========================================
  # Stores no feature values: offline in Iceberg, online in valkey, only
  # definitions in the SQL registry.
  #
  # Upload your own feature repository to s3://feast/repo, as DAGs go to
  # s3://airflow/dags, and run `feast apply` yourself. Your environment needs
  # feast[duckdb,iceberg,redis,postgres]; the image needs no extras because
  # neither service reads Iceberg.
  #
  # The image sets no CMD, so both services name their own command.
  feast-ui:
    image: &feast-image quay.io/feastdev/feature-server:0.68.0
    container_name: feast-ui
    profiles: ["feast"]
    networks:
      - odctl
    ports:
      - "127.0.0.1:8890:8888"
    mem_limit: 1g
    environment:
      <<: *feast-env
    volumes:
      - ./feast:/bundled_repo:ro
    command: ["python", "-c", *feast-repo-sync, "ui", "--host", "0.0.0.0", "--port", "8888"]
    # Every Feast process creates the registry tables when it starts. Started
    # together on a fresh database, the two containers both try, and the loser
    # exits. Waiting for feast-serve means the tables already exist.
    depends_on:
      feast-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/api/v1/projects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  feast-serve:
    image: *feast-image
    container_name: feast-serve
    profiles: ["feast"]
    networks:
      - odctl
    ports:
      - "127.0.0.1:6566:6566"
    mem_limit: 1g
    environment:
      <<: *feast-env
    volumes:
      - ./feast:/bundled_repo:ro
    # --metrics starts Feast's Prometheus endpoint on port 8000, inside the network.
    command: ["python", "-c", *feast-repo-sync, "serve", "--host", "0.0.0.0", "--port", "6566", "--no-access-log", "--metrics"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6566/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ==========================================
  # Evidently: ML Monitoring
  # ==========================================
  # Keeps data drift, prediction drift, data quality and model quality reports,
  # and dashboards over them. Reports are computed by the client, for example an
  # Airflow task, and pushed here with RemoteWorkspace.
  #
  # evidently/config.yaml keeps projects, reports, dashboards and datasets in the
  # evidently database. There is no login, and no secret is set, so anything
  # that reaches the port can write.
  evidently:
    image: evidently/evidently-service:0.7.23
    container_name: evidently
    profiles: ["evidently"]
    networks:
      - odctl
    ports:
      # Host 8089: 8000 is the default for uvicorn, Django and mkdocs serve, so
      # it often clashes with the user's own apps.
      - "127.0.0.1:8089:8000"
    mem_limit: 1g
    environment:
      TZ: ${TZ:-UTC}
      # Read by @format in evidently/config.yaml.
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # Usage telemetry to Evidently is on unless this is set.
      DO_NOT_TRACK: "1"
    volumes:
      - ./evidently/config.yaml:/etc/evidently/config.yaml:ro
    # Appended to the image's entrypoint, `evidently ui --host 0.0.0.0`.
    command: ["--conf-path", "/etc/evidently/config.yaml"]
    # /api/v2/projects rather than /api/version, because listing projects opens
    # the database and runs the migrations. /api/version answers with no
    # database at all. The image has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/projects', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ==========================================
  # Label Studio: Data Labelling
  # ==========================================
  # Keeps projects, tasks and annotations in the labelstudio database on
  # PostgreSQL, which postgres/01-init-databases.sh creates on a new data folder.
  label-studio:
    image: heartexlabs/label-studio:1.23.2
    container_name: label-studio
    profiles: ["label-studio"]
    networks:
      - odctl
    ports:
      # Host 8088: 8080 is Trino's, and 8087 and 8089 are taken.
      - "127.0.0.1:8088:8080"
    # One process. On a first start on a new database and one run of the smoke
    # case it peaked at 524 MiB, page cache included, and held 240 MiB after.
    mem_limit: 768m
    environment:
      TZ: ${TZ:-UTC}
      DJANGO_DB: default
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: ${POSTGRES_USER:-user}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRE_HOST: postgres
      POSTGRE_PORT: "5432"
      # The first user and its API token, created on the first start. These are
      # local-only values, as the other profiles' logins are. Label Studio
      # applies a token only when it is longer than 5 characters.
      LABEL_STUDIO_USERNAME: user@odctl.io
      LABEL_STUDIO_PASSWORD: password
      LABEL_STUDIO_USER_TOKEN: odctl-label-studio-token
      # Without this, the token above gets 401 "legacy token authentication has
      # been disabled for this organization". It is read once, when the first
      # start creates the organization.
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
      # Usage analytics to Label Studio are on unless this is set.
      LABEL_STUDIO_COLLECT_ANALYTICS: "false"
      # Label Studio 1.23.1 and later refuse calls to private addresses, which
      # every container on the odctl network has. These two let it reach an ML
      # backend and a webhook receiver on that network, at a name with a dot,
      # such as a network alias my-backend.odctl. The UI is published on
      # 127.0.0.1 only.
      ML_BLOCK_LOCAL_IP: "false"
      USE_DEFAULT_BANNED_SUBNETS: "false"
      # S3 storage reaches SeaweedFS through this address, which Label Studio
      # trusts, so leave the endpoint field of a storage connection empty. The
      # storage profile creates the label-studio bucket.
      LABEL_STUDIO_S3_ENDPOINT: http://seaweed:8333
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  odctl:
    name: odctl
    external: true
