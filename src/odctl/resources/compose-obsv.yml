name: odctl-obsv

services:
  # ==========================================
  # [PROFILE: lineage] Marquez API
  # ==========================================
  marquez-api:
    image: marquezproject/marquez:0.51.1
    container_name: marquez-api
    profiles:
      - lineage
    networks:
      - odctl
    ports:
      - "5002:5000" # API
      - "5001:5001" # Admin
    restart: on-failure
    mem_limit: 1g
    environment:
      # Leverage the unified Postgres instance from compose-infra.yml
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: marquez
      MARQUEZ_CONFIG: /usr/src/app/marquez.yml
    volumes:
      - ./marquez/marquez.yml:/usr/src/app/marquez.yml
    command: ["server", "/usr/src/app/marquez.yml"]
    # Admin port, and it checks Postgres too, so marquez-web waits for a
    # Marquez that can actually serve rather than one that has just started.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ==========================================
  # [PROFILE: lineage] Marquez Web UI
  # ==========================================
  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: marquez-web
    profiles:
      - lineage
    networks:
      - odctl
    ports:
      - "3003:3000"
    mem_limit: 512m
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
    depends_on:
      marquez-api:
        condition: service_healthy
    restart: on-failure

  # ==========================================
  # [PROFILE: telemetry] grafana/otel-lgtm
  # ==========================================
  # One container: OpenTelemetry Collector, Prometheus, Tempo, Loki, Pyroscope and
  # Grafana. It replaces separate Prometheus, Alertmanager and Grafana services;
  # odctl defines no alert rules, so Alertmanager did no work. The aliases keep
  # http://prometheus:9090 and http://grafana:3000 resolving on the network.
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.1
    container_name: otel-lgtm
    profiles:
      - telemetry
    networks:
      odctl:
        aliases:
          - prometheus
          - grafana
    ports:
      - "19090:9090" # Prometheus, which also takes OTLP at /api/v1/otlp/v1/metrics
      - "3004:3000" # Grafana
      - "4317:4317" # OTLP gRPC, through the collector
      - "4318:4318" # OTLP HTTP, through the collector
    mem_limit: 2g
    environment:
      # The image enables anonymous Admin by default; odctl keeps a login.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-user}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-password}
      # The collector also reads odctl's receivers for PostgreSQL and Valkey.
      OTELCOL_EXTRA_ARGS: --config=file:./odctl-receivers.yaml
      ODCTL_POSTGRES_USER: ${POSTGRES_USER:-user}
      ODCTL_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      ODCTL_VALKEY_USER: user
      ODCTL_VALKEY_PASSWORD: password
    volumes:
      # odctl's scrape jobs, merged with the image's own settings.
      - ./prometheus/prometheus.yml:/otel-lgtm/prometheus.yaml
      - ./otelcol/odctl-receivers.yaml:/otel-lgtm/odctl-receivers.yaml
    healthcheck:
      # run-all.sh writes /tmp/ready once every component answers its /ready.
      test: ["CMD-SHELL", "test -f /tmp/ready && curl -fsS http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

networks:
  odctl:
    name: odctl
    external: true
