name: odctl-orch

# ==========================================
# Shared Airflow settings
# ==========================================
x-airflow-common: &airflow-common
  image: ghcr.io/jaehyeon-kim/odctl/airflow:${TAG:-latest}
  networks:
    - odctl
  profiles:
    - airflow
  mem_limit: 1500m
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Worker processes the LocalExecutor runs tasks in. The default of 32 is far more
    # than a laptop needs, and each idle one holds memory.
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres/airflow
    # `airflow standalone` always uses SimpleAuthManager. The user and password are
    # fixed here, since it would otherwise generate a random password.
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "user:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Down from the default 300, so new DAG files are parsed sooner.
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "120"
    # Tasks call the Execution API, which runs in this same container.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://localhost:8080/execution/"
    # Must match across scheduler and api-server, or tasks get "Invalid auth token".
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-Ck3aVwEHhGHlzrBLKRcTJBOaTpMIbOBBKq7vDWQ5cNA=}
    # AWS Credentials for Iceberg/Boto3 tasks and Sidecar Sync
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
    AWS_DEFAULT_REGION: us-east-1
    # MLflow and Feast clients in tasks. Feast reads S3 settings only from these
    # variables, as the feast services in compose-mlops.yml do; ODCTL must match
    # the catalog_name passed to IcebergSource.
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Feast's SQL registry, for tasks that build a FeatureStore from their own config.
    FEAST_REGISTRY: postgresql+psycopg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/feast
    # Scheduler, DAG processor and task metrics pushed over OTLP/HTTP to the
    # telemetry profile's collector. Without it, the exporter only logs failures.
    AIRFLOW__METRICS__OTEL_ON: "True"
    AIRFLOW__METRICS__OTEL_HOST: otel-lgtm
    AIRFLOW__METRICS__OTEL_PORT: "4318"
    AIRFLOW__METRICS__OTEL_INTERVAL_MILLISECONDS: "15000"
    PYICEBERG_CATALOG__ODCTL__TYPE: rest
    PYICEBERG_CATALOG__ODCTL__URI: http://catalog:8181
    PYICEBERG_CATALOG__ODCTL__WAREHOUSE: s3://warehouse/
    PYICEBERG_CATALOG__ODCTL__S3__ENDPOINT: http://seaweed:8333
    PYICEBERG_CATALOG__ODCTL__S3__ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-user}
    PYICEBERG_CATALOG__ODCTL__S3__SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
    PYICEBERG_CATALOG__ODCTL__S3__PATH_STYLE_ACCESS: "true"
    PYICEBERG_CATALOG__ODCTL__S3__REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    # DAGs are read straight from s3://airflow/dags, so no sync sidecar is needed.
    # A changed file is picked up within refresh_interval seconds.
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [{"name": "s3-dags",
        "classpath": "airflow.providers.amazon.aws.bundles.s3.S3DagBundle",
        "kwargs": {"aws_conn_id": "aws_default", "bucket_name": "airflow",
                   "prefix": "dags", "refresh_interval": 15}}]
    AIRFLOW_CONN_AWS_DEFAULT: >-
      {"conn_type": "aws", "login": "${AWS_ACCESS_KEY_ID:-user}",
       "password": "${AWS_SECRET_ACCESS_KEY:-password}",
       "extra": {"endpoint_url": "http://seaweed:8333", "region_name": "us-east-1"}}
    # For quick experiments
    _PIP_ADDITIONAL_REQUIREMENTS: ${_AIRFLOW_PIP_DEPS:-}
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # ==========================================
  # [PROFILE: airflow] Orchestration
  # ==========================================
  # One container: `airflow standalone` runs the API server, scheduler, DAG
  # processor and triggerer together, against odctl's PostgreSQL. Airflow offers
  # standalone for local use, which is what odctl is for.
  airflow:
    <<: *airflow-common
    container_name: airflow
    mem_limit: 3g
    ports:
      - "8085:8080"
    restart: unless-stopped
    # The image's own entrypoint runs first: it installs _PIP_ADDITIONAL_REQUIREMENTS,
    # then runs this bash command unchanged.
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        echo '{"user": "password"}' > /opt/airflow/passwords.json
        # Plugins are not part of a DAG bundle, so copy s3://airflow/plugins once
        # at start. A changed plugin needs a restart, as Airflow loads plugins then.
        python - <<'PY'
        import os, boto3
        s3 = boto3.client("s3", endpoint_url="http://seaweed:8333")
        pages = s3.get_paginator("list_objects_v2").paginate(Bucket="airflow", Prefix="plugins/")
        for page in pages:
            for obj in page.get("Contents", []):
                path = os.path.join("/opt/airflow", obj["Key"])
                if obj["Key"].endswith("/"):
                    continue
                os.makedirs(os.path.dirname(path), exist_ok=True)
                s3.download_file("airflow", obj["Key"], path)
        PY
        exec airflow standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

networks:
  odctl:
    name: odctl
    external: true
