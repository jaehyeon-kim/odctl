# Replaces /otel-lgtm/prometheus.yaml in grafana/otel-lgtm. The global, otlp and
# storage blocks are copied from the image's own file, so OTLP metrics keep their
# resource attributes as labels and late samples are still accepted. The scrape
# jobs are odctl's. There is no alerting block: odctl defines no alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_native_histograms: true

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database
    - kafka.cluster.alias

storage:
  tsdb:
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "flink"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "jobmanager:9249"
          - "taskmanager-a:9249"
          - "taskmanager-b:9249"
          - "taskmanager-c:9249"

  - job_name: "clickhouse"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "ch-11:9363"
          - "ch-12:9363"
          - "ch-21:9363"
          - "ch-22:9363"

  - job_name: "marquez"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["marquez-api:5000"]

  # Spark answers 302 without the trailing slash.
  - job_name: "spark-master"
    metrics_path: "/metrics/master/prometheus/"
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: "spark-applications"
    metrics_path: "/metrics/applications/prometheus/"
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: "spark-worker"
    metrics_path: "/metrics/prometheus/"
    static_configs:
      - targets: ["spark-worker-1:8081", "spark-worker-2:8081", "spark-worker-3:8081"]

  - job_name: "mlflow"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["mlflow:5000"]

  - job_name: "feast-serve"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["feast-serve:8000"]

  # JMX exporter agent from the deps image. kafka-1 to kafka-3 exist only in kafka-full.
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9404", "kafka-1:9404", "kafka-2:9404", "kafka-3:9404"]

  - job_name: "kafka-connect"
    static_configs:
      - targets: ["connect:9404"]

  - job_name: "karapace"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["karapace:8081"]

  # Trino serves /metrics only to a user allowed to read system information,
  # which rules.json grants to `prometheus`. No password is set.
  - job_name: "trino"
    metrics_path: "/metrics"
    basic_auth:
      username: "prometheus"
    static_configs:
      - targets: ["trino:8080"]

  - job_name: "metabase"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["metabase:9191"]

  - job_name: "openmetadata"
    metrics_path: "/prometheus"
    static_configs:
      - targets: ["openmetadata-server:8586"]

  - job_name: "fluss"
    static_configs:
      - targets: ["fluss-coordinator:9249", "fluss-tablet-1:9249"]

  - job_name: "seaweedfs"
    static_configs:
      - targets: ["seaweed:9327"]

  # JMX exporter agent; the REST catalog has no metrics endpoint of its own.
  - job_name: "iceberg-catalog"
    static_configs:
      - targets: ["catalog:9404"]
