# ==========================================
# Semantic Capacities (The Engine's Vocabulary)
# ==========================================
capacities:
  data_processing: "batch processing distributed computing large scale data transformation pipelines"
  stream_processing: "real-time stream processing stateful streaming continuous data flows"
  analytics: "real-time OLAP interactive querying data warehouse business intelligence dashboards reporting"
  mlops: "machine learning training pipelines model serving feature store experiments tracking"
  messaging: "event delivery pub sub queues streaming storage message broker"
  orchestration: "workflow scheduling DAGs pipeline execution automation"
  metadata: "data catalog governance discovery search data dictionary"
  observability: "metrics monitoring traces logs opentelemetry otlp grafana prometheus telemetry dashboards"
  lineage: "data lineage provenance data flow troubleshooting tracing marquez"
# ==========================================
# Stack Registry (The Execution Map)
# ==========================================
stacks:
  deps:
    file: "compose-deps.yml"
    description: "Shared dependencies, JARs, connectors, and Docker network"
    profiles: ["deps"]
    capacities: []
    depends_on:
      deps: []
    role: "Ephemeral init-container. It populates the shared Docker volume with downloaded JARs (Iceberg, Flink, Spark) and Kafka connectors before shutting down."
    usage: |
      • Runs automatically on 'odctl up'.
      • No persistent UI or ports exposed.

  postgres:
    file: "compose-infra.yml"
    description: "PostgreSQL metadata backend."
    profiles: ["postgres"]
    parent: "infra"
    capacities: []
    depends_on:
      postgres: ["deps"]
    role: "The foundational state-store using pgvector. Holds metadata for Iceberg, Airflow, MLflow, and OpenMetadata."
    usage: |
      • Postgres JDBC:
        - External (host): jdbc:postgresql://127.0.0.1:5432/odctl
        - Internal (Docker): jdbc:postgresql://postgres:5432/odctl
        - Credentials: user / password

  storage:
    file: "compose-infra.yml"
    description: "SeaweedFS S3-compatible object storage."
    profiles: ["storage"]
    parent: "infra"
    capacities: []
    depends_on:
      storage: ["deps"]
    role: "Acts as the physical data lake (S3 equivalent). Holds Parquet/Iceberg files and Airflow DAGs."
    usage: |
      • S3 Browser UI:
        - External (host): http://127.0.0.1:8889
        - Internal (Docker): http://seaweed:8888
      • S3 API Endpoint:
        - External (host): http://127.0.0.1:8333
        - Internal (Docker): http://seaweed:8333
        - Default AWS Keys: user / password

  catalog:
    file: "compose-infra.yml"
    description: "Iceberg REST Catalog."
    profiles: ["catalog"]
    parent: "infra"
    capacities: []
    depends_on:
      catalog: ["postgres", "storage"]
    role: "Central metadata gateway for Iceberg. All compute engines route through this REST API."
    usage: |
      • REST API Endpoint:
        - External (host): http://127.0.0.1:8181
        - Internal (Docker): http://catalog:8181

  kafka:
    file: "compose-kafka.yml"
    description: "Distributed event streaming and schema registry. Lite uses 1 Broker; Full uses 3 Brokers."
    profiles: ["kafka-lite", "kafka-full"]
    capacities: ["messaging"]
    depends_on:
      kafka-lite: ["deps"]
      kafka-full: ["deps"]
    role: "KRaft broker(s) with Aiven Karapace for Avro/JSON schema validation and Connect for data ingestion."
    usage:
      kafka-lite: |
        • Kafka UI:
          - External (host): http://127.0.0.1:8086
          - Internal (Docker): http://kafka-ui:8080
        • Schema Registry & Connect:
          - External (host): http://127.0.0.1:8081 / http://127.0.0.1:8083
        • Bootstrap Servers (1-Node Lite):
          - External (host): 127.0.0.1:9092
          - Internal (Docker): broker-1:19092
        • Port 29092 is a minikube listener, not a host endpoint. It is
          advertised as host.minikube.internal:29092, which does not resolve
          on a normal host, so a client connects and then fails to produce.
          Use 127.0.0.1:9092 from the host.
      kafka-full: |
        • Kafka UI:
          - External (host): http://127.0.0.1:8086
          - Internal (Docker): http://kafka-ui:8080
        • Schema Registry & Connect:
          - External (host): http://127.0.0.1:8081 / http://127.0.0.1:8083
        • Bootstrap Servers (3-Node Cluster):
          - External (host): 127.0.0.1:9092, 127.0.0.1:9093, 127.0.0.1:9094
          - Internal (Docker): broker-1:19092, broker-2:19093, broker-3:19094
        • Ports 29092, 29093 and 29094 are minikube listeners, not host
          endpoints. They are advertised as host.minikube.internal, which does
          not resolve on a normal host, so a client connects and then fails to
          produce. Use 127.0.0.1:9092, 9093 and 9094 from the host.

  flink:
    file: "compose-flink.yml"
    description: "Stateful, real-time stream processing engine. Lite uses 1 TaskManager; Full uses 3 TaskManagers."
    profiles: ["flink-lite", "flink-full"]
    capacities: ["stream_processing"]
    depends_on:
      flink-lite: ["catalog"]
      flink-full: ["catalog"]
    role: "Executes continuous streaming pipelines. Lite uses 1 TaskManager; Full uses 3 TaskManagers."
    usage:
      flink-lite: |
        • Flink JobManager UI (1 TaskManager):
          - External (host): http://127.0.0.1:8082
          - Internal (Docker): http://jobmanager:8081
        • SQL Gateway REST:
          - External (host): http://127.0.0.1:8084
          - Internal (Docker): http://flink-sql-gateway:8083
      flink-full: |
        • Flink JobManager UI (3 TaskManagers):
          - External (host): http://127.0.0.1:8082
          - Internal (Docker): http://jobmanager:8081
        • SQL Gateway REST:
          - External (host): http://127.0.0.1:8084
          - Internal (Docker): http://flink-sql-gateway:8083

  spark:
    file: "compose-spark.yml"
    description: "Distributed batch and micro-batch data processing. Lite uses 1 Worker; Full uses 3 Workers."
    profiles: ["spark-lite", "spark-full"]
    capacities: ["data_processing"]
    depends_on:
      spark-lite: ["catalog"]
      spark-full: ["catalog"]
    role: "Distributed batch engine for data preparation and large-scale ETL."
    usage:
      spark-lite: |
        • Spark Master UI (1 Worker):
          - External (host): http://127.0.0.1:9080
          - Internal (Docker): http://spark-master:8080
        • Master RPC:
          - External (host): spark://127.0.0.1:7077
          - Internal (Docker): spark://spark-master:7077
        • Spark History Server:
          - External (host): http://127.0.0.1:18080
          - Internal (Docker): http://spark-history:18080
      spark-full: |
        • Spark Master UI (3 Workers):
          - External (host): http://127.0.0.1:9080
          - Internal (Docker): http://spark-master:8080
        • Master RPC:
          - External (host): spark://127.0.0.1:7077
          - Internal (Docker): spark://spark-master:7077
        • Spark History Server:
          - External (host): http://127.0.0.1:18080
          - Internal (Docker): http://spark-history:18080

  store:
    file: "compose-store.yml"
    description: "Stream storage (Fluss) and multi-model data store (Valkey Bundle). Valkey includes advanced JSON, Bloom, and Vector Search capabilities."
    profiles: ["fluss", "valkey"]
    depends_on:
      fluss: ["deps"]
      valkey: ["deps"]
    role: "Stream storage (Fluss) and multi-model data store (Valkey Bundle)."
    usage:
      fluss: |
        • Fluss Coordinator API:
          * External (host): 127.0.0.1:9123
          * Internal (Docker): fluss-coordinator:9123
      valkey: |
        • Valkey (Multi-Model Data Store: Cache, JSON, Vector Search):
          * External (host): 127.0.0.1:6379
          * Internal (Docker): valkey:6379
          * Authentication: username 'user', password 'password'

  analytics:
    file: "compose-analytics.yml"
    description: "Real-time OLAP database (ClickHouse), Federated SQL engine (Trino), and BI dashboards (Metabase)."
    profiles: ["ch-lite", "ch-full", "trino", "metabase"]
    capacities: ["analytics"]
    depends_on:
      ch-lite: ["deps"]
      ch-full: ["deps"]
      trino: ["postgres"]
      metabase: ["postgres"]
    role: "ClickHouse provides real-time OLAP; Trino federates queries across Iceberg/Postgres; Metabase handles visualization."
    usage:
      ch-lite: |
        • ClickHouse HTTP (Shard 1 / Replica 1 & 2):
          * External (host): http://127.0.0.1:8123, http://127.0.0.1:8124
          * Internal (Docker): http://ch-11:8123, http://ch-12:8123
      ch-full: |
        • ClickHouse HTTP (Shards 1 & 2 / Replicas 1 & 2):
          * External (host): http://127.0.0.1:8123, http://127.0.0.1:8124, http://127.0.0.1:8125, http://127.0.0.1:8126
          * Internal (Docker): http://ch-11:8123, http://ch-12:8123, http://ch-21:8123, http://ch-22:8123
      trino: |
        • Trino UI & JDBC connection (no password: no authenticator is
          configured, so any username is accepted):
          * External (host): http://127.0.0.1:8080
          * Internal (Docker): http://trino:8080
        • Identities: `docker exec -it trino trino` connects as `trino`, the
          CLI default. Pass `--user user` for the stack-wide convention, or
          `--user analyst`, which trino/rules.json denies schema ownership
          while leaving every table privilege in place.
        • Catalogs: postgres works with the trino profile alone. iceberg,
          kafka, clickhouse and valkey load without their backing services,
          so they appear in SHOW CATALOGS and then fail at query time unless
          catalog, storage, kafka-lite, ch-lite or valkey is also up.
      metabase: |
        • Metabase Dashboard Engine:
          * External (host): http://127.0.0.1:3000
          * Internal (Docker): http://metabase:3000

  orch:
    file: "compose-orch.yml"
    description: "Workflow orchestration and pipeline scheduling."
    profiles: ["airflow"]
    capacities: ["orchestration"]
    depends_on:
      airflow: ["postgres", "storage"]
    role: "Central nervous system for scheduling data pipelines, ETL, and ML training runs."
    usage:
      airflow: |
        • Airflow Web UI (Credentials: user / password):
          * External (host): http://127.0.0.1:8085
          * Internal (Docker): http://airflow:8080
        • DAGs: read from s3://airflow/dags every 15 seconds.
        • Plugins: copied from s3://airflow/plugins at start. Airflow loads
          plugins only once, so run `odctl restart airflow` after changing one.

  mlops:
    file: "compose-mlops.yml"
    description: "Experiment tracking, model registry and model serving (MLflow), and the feature store (Feast)."
    profiles: ["mlflow", "feast"]
    capacities: ["mlops"]
    depends_on:
      mlflow: ["postgres", "storage"]
      feast: ["catalog", "valkey"]
    role: "Manages the ML lifecycle. MLflow tracks experiments, keeps the model registry and scores a registered model over HTTP. Feast holds feature definitions in a SQL registry on Postgres, reads offline values from the Iceberg tables behind catalog and storage, and serves online values from Valkey; it stores no feature values of its own."
    usage:
      mlflow: |
        • MLflow Tracking UI & Artifact Registry Server:
          * External (host): http://127.0.0.1:5004
          * Internal (Docker): http://mlflow:5000
        • MLflow Model Scoring Server, idle until MODEL_URI in .env names a model;
          run `odctl up mlflow` again after setting it:
          * External (host): http://127.0.0.1:5003/invocations
          * Internal (Docker): http://mlflow-serve:5003/invocations
        • Liveness: http://127.0.0.1:5003/ping and http://127.0.0.1:5003/health
      feast: |
        • Feast UI (registry browser, not data):
          * External (host): http://127.0.0.1:8890
          * Internal (Docker): http://feast-ui:8888
        • Upload your feature repository to s3://feast/repo. The services check
          it every 15 seconds and restart Feast when it changes. Run
          `feast apply` from your own environment. odctl ships no definitions.
        • Your environment needs: feast[duckdb,iceberg,redis,postgres]
        • On an IcebergSource against catalog, pass warehouse="" and
          catalog_name="odctl". The REST client puts warehouse in the URL path,
          and iceberg-rest-fixture serves the spec with no prefix.
        • Online feature server for get_online_features:
          * External (host): http://127.0.0.1:6566
          * Internal (Docker): http://feast-serve:6566
        • Liveness: http://127.0.0.1:6566/health

  obsv:
    file: "compose-obsv.yml"
    description: "System telemetry, monitoring, and data lineage."
    profiles: ["lineage", "telemetry"]
    capacities: ["observability", "lineage"]
    depends_on:
      lineage: ["postgres"]
      telemetry: ["deps"]
    role: "Data provenance tracking (Marquez), and metrics, traces and logs over OpenTelemetry in one grafana/otel-lgtm container (Prometheus, Tempo, Loki, Grafana)."
    usage:
      lineage: |
        • Marquez API Metadata Endpoint:
          * External (host): http://127.0.0.1:5002
          * Internal (Docker): http://marquez-api:5000
        • Marquez Lineage Graph Web UI:
          * External (host): http://127.0.0.1:3003
          * Internal (Docker): http://marquez-web:3000
      telemetry: |
        • Prometheus Time Series Engine (also takes OTLP at /api/v1/otlp/v1/metrics):
          * External (host): http://127.0.0.1:19090
          * Internal (Docker): http://prometheus:9090
        • Grafana Dashboards (Credentials: user / password):
          * External (host): http://127.0.0.1:3004
          * Internal (Docker): http://grafana:3000
        • OTLP Receiver (metrics, traces and logs):
          * External (host): 127.0.0.1:4317 (gRPC), http://127.0.0.1:4318 (HTTP)
          * Internal (Docker): otel-lgtm:4317 (gRPC), http://otel-lgtm:4318 (HTTP)

  metadata:
    file: "compose-metadata.yml"
    description: "Data catalog, discovery, and governance platform."
    profiles: ["metadata"]
    capacities: ["metadata"]
    depends_on:
      metadata: ["postgres"]
    role: "Enterprise data catalog utilizing Elasticsearch and Postgres backends."
    usage: |
      • OpenMetadata UI & REST API:
        - External (host): http://127.0.0.1:8585
        - Internal (Docker): http://openmetadata-server:8585
      • Ingestion Pipeline UI:
        - External (host): http://127.0.0.1:8087
        - Internal (Docker): http://openmetadata-ingestion:8080
      • Default Admin: admin@open-data.local / admin
