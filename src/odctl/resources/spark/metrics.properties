# Prometheus-format metrics in each Spark UI, from Spark's own PrometheusServlet
# sink. The master serves /metrics/master/prometheus and
# /metrics/applications/prometheus on 8080, a worker /metrics/prometheus on 8081,
# and a running driver /metrics/prometheus on 4040. The history server is not a
# metrics instance, so it has no endpoint.
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus
master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus
