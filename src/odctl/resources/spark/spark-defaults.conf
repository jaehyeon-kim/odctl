# ========================================
# Dependencies / Classpath
# ========================================
# Automatically load all JARs downloaded by the init-deps container
spark.driver.extraClassPath   /mnt/shared-deps/shared/*:/mnt/shared-deps/spark/*
spark.executor.extraClassPath /mnt/shared-deps/shared/*:/mnt/shared-deps/spark/*

# ========================================
# Iceberg REST Catalog Integration
# ========================================
spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type         rest
spark.sql.catalog.iceberg.uri          http://catalog:8181
spark.sql.catalog.iceberg.io-impl      org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint  http://seaweed:8333
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.defaultCatalog               iceberg

# SeaweedFS ignores the region, but the AWS SDK refuses to build a client
# without one, and the default credential chain finds nothing in a container.
spark.sql.catalog.iceberg.s3.access-key-id      user
spark.sql.catalog.iceberg.s3.secret-access-key  password
spark.sql.catalog.iceberg.client.region         us-east-1

# ========================================
# Hadoop S3A (for the storage-walking Iceberg procedures)
# ========================================
# Iceberg reads and writes data through S3FileIO above. Two procedures do not:
# remove_orphan_files lists the table location and add_files stages manifests,
# and both go through Hadoop's FileSystem API. Without this block they fail with
# "No FileSystem for scheme s3". Mapping both schemes means a table location
# recorded as s3:// resolves without rewriting it to s3a://.
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                    http://seaweed:8333
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.access.key                  user
spark.hadoop.fs.s3a.secret.key                  password
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.endpoint.region             us-east-1
spark.hadoop.fs.s3a.connection.ssl.enabled      false

# ========================================
# History Server & Event Logging (Local Volume)
# ========================================
spark.eventLog.enabled           true
spark.eventLog.dir               file:///tmp/spark-events
spark.history.fs.logDirectory    file:///tmp/spark-events
