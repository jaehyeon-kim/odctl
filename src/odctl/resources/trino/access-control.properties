# File-based access control, which is what makes column masks and row filters
# available. Trino allows everything by default, so without this file the rules
# in rules.json are never consulted.
#
# Note that rules.json itself must carry no comments: Trino parses it strictly
# and rejects any unknown field, including a "_comment" key. So the explanation
# lives here instead.
#
# No authenticator is configured, so Trino trusts whatever identity the client
# claims and there is no password. That keeps `docker exec -it trino trino`
# working, which is how the docs open every session. It is a lab convenience,
# not a security boundary.
#
# Identities in rules.json:
#   trino    the CLI default inside the container, unrestricted
#   user     the stack-wide convention shared with Postgres, SeaweedFS and
#            ClickHouse, unrestricted through the catch-all rule
#   analyst  restricted, so `--user analyst` shows a row filter and a column
#            mask on the tables the labs create in step 3, and nothing else
#            needs configuring to demonstrate them
access-control.name=file
security.config-file=/etc/trino/rules.json
