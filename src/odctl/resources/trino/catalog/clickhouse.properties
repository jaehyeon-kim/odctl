connector.name=clickhouse
# compress=false is what keeps this catalog usable, not a tuning knob. The
# clickhouse-jdbc 0.7.1 driver shaded into Trino 480 asks for a compressed
# response two ways at once: the compress=1 URL parameter, which selects
# ClickHouse's native compressed-block framing, and an Accept-Encoding: lz4
# header. ClickHouse only honoured the header when enable_http_compression was
# turned on, and that setting now defaults to 1, so the server wraps the native
# blocks in an LZ4 frame and answers Content-Encoding: lz4. The driver never
# unwraps that frame: it reads the frame's bytes as a block header and dies with
# "Magic is not correct - expect [-126] but got [123]", which is 0x82 expected
# against the '{' it found inside the frame. Every query through the catalog
# fails, listing schemas included. Setting compress=false drops both the
# parameter and the header, so the body arrives as plain RowBinary. The response
# is uncompressed over the container network, which costs nothing here.
connection-url=jdbc:clickhouse://ch-11:8123/feature_store?compress=false
connection-user=user
connection-password=password
